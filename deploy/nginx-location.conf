#
# Add both locations to the 8443 server block in /etc/nginx/conf.d/mcp.conf,
# next to the other /mcp/* locations. X-Forwarded-User is what scopes every
# tool call to a tenant; proxy_set_header overwrites anything the client sent.
#
# The two endpoints are separate on purpose (plan invariant I-2): the
# orchestrating Claude reads untrusted agent output, so the tools that create
# and delete tenants must not be reachable from the connector it is using.
# Being on this location is only half the check — the service also requires
# the caller's tenant record to say "admin": true.
#
# auth_basic_user_file is set per location so that logins this service
# provisions get THIS service only, never the server-level .htpasswd-mcp that
# grants every fleet MCP. nginx must be able to traverse to the file:
# /var/lib/mcp-agentbridge needs mode 0711, or an authenticated request gets a
# 500 while an unauthenticated one still gets a clean 401.

    location ^~ /mcp/agentbridge {
	if ($http_accept ~* "text/html") {
            rewrite ^ /_mcp_hello last;
        }
	rewrite ^/mcp/agentbridge(.*)$ /mcp$1 break;
	include snippets/mcp-proxy-headers.conf;
	proxy_set_header X-Forwarded-User $remote_user;
	auth_basic           "agentbridge";
	auth_basic_user_file /var/lib/mcp-agentbridge/htpasswd/users;
	proxy_pass http://127.0.0.1:8817;
    }

    # The live fleet page (read-only GETs).
    #
    # Relative asset URLs on the page resolve against the trailing slash, so
    # the slashless form redirects rather than serving a page whose CSS and JS
    # 404. A <base> tag would be the other fix, but the page's own CSP sets
    # base-uri 'none'.
    #
    # absolute_redirect off is NOT optional: this server listens on
    # 127.0.0.1:8443 behind an SNI stream proxy on 443, so nginx's default
    # absolute redirect would send the browser to :8443 — a loopback-only
    # port — and the page would simply time out.
    location = /mcp/agentbridge/ui {
	absolute_redirect off;
	return 301 /mcp/agentbridge/ui/;
    }

    location ^~ /mcp/agentbridge/ui/ {
	rewrite ^/mcp/agentbridge/ui/(.*)$ /ui/$1 break;

	# Deliberately NOT snippets/mcp-proxy-headers.conf. That snippet
	# rewrites any browser GET (Accept: text/html) to the MCP stub page and
	# forces Accept: application/json — both correct for an MCP endpoint
	# and both wrong for a real web page. These are its remaining headers.
	proxy_set_header Host localhost:$server_port;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	# The service must never see the Basic credential.
	proxy_set_header Authorization "";
	proxy_set_header X-Forwarded-User $remote_user;

	auth_basic           "agentbridge";
	auth_basic_user_file /var/lib/mcp-agentbridge/htpasswd/users;

	# Server-Sent Events: no buffering, and a long read timeout, or the
	# event stream is batched up and then cut off.
	proxy_buffering off;
	proxy_cache off;
	proxy_read_timeout 86400s;
	proxy_http_version 1.1;
	proxy_pass http://127.0.0.1:8817;
    }

    # Administration: provision_user, deprovision_user, list_users.
    # Note the ^~ prefix match and the order: this block must come BEFORE the
    # one above would match, which nginx guarantees by taking the longest
    # prefix match, so /mcp/agentbridge-admin never lands on the user endpoint.
    location ^~ /mcp/agentbridge-admin {
	if ($http_accept ~* "text/html") {
            rewrite ^ /_mcp_hello last;
        }
	rewrite ^/mcp/agentbridge-admin(.*)$ /mcp$1 break;
	include snippets/mcp-proxy-headers.conf;
	proxy_set_header X-Forwarded-User $remote_user;
	auth_basic           "agentbridge admin";
	auth_basic_user_file /var/lib/mcp-agentbridge/htpasswd/users;
	proxy_pass http://127.0.0.1:8818;
    }
